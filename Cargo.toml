[package]
name = "steery-sdk"
# The SDK's own version, not Steery's: a program's Cargo.lock records it, so it moves only
# when this crate's API does. Its major is the protocol it speaks (PROTOCOL.md).
version = "4.3.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/steery-dev/sdk"
readme = "README.md"
description = "Steery's program protocol: the wire types, the stdio server a driver or an adapter runs, the client the Steery runtime speaks it with, and the release manifest programs are published by"
keywords = ["steery", "agents", "protocol", "json-rpc"]
categories = ["development-tools"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "PROTOCOL.md", "LICENSE"]

[lib]
name = "steery_sdk"

[features]
## JSON Schema derivation (schemars) for every wire type.
schema = ["dep:schemars"]

# Writes `schema/protocol-v4.json`.
[[example]]
name = "schema"
required-features = ["schema"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "process", "rt", "sync", "time"] }
schemars = { version = "1", optional = true }

# The client's SIGTERM to a program still running after `shutdown` (PROTOCOL.md §2):
# tokio's own kill is SIGKILL.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints.clippy]
too_many_arguments = "allow"
result_large_err = "allow"
type_complexity = "allow"
